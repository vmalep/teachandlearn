{% extends "base.html" %}
{% load i18n %}
{% block title %}{% trans "Password updated" %} — TeachAndLearn{% endblock %}
{% block content %}
<div class="min-h-full flex items-center justify-center py-12 px-4">
  <div class="w-full max-w-md text-center">
    <h1 class="text-2xl font-bold text-slate-900 mb-2">{% trans "Password updated" %}</h1>
    <p class="text-slate-500 mb-6">{% trans "Your password has been changed successfully." %}</p>
    <a href="/accounts/login/"
      class="inline-block bg-violet-600 text-white px-6 py-2.5 rounded-lg font-medium hover:bg-violet-700 transition-colors">
      {% trans "Sign in" %}
    </a>
  </div>
</div>
{% endblock %}
