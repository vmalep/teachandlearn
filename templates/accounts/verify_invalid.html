{% extends "base.html" %}
{% load i18n %}
{% block title %}{% trans "Invalid link" %} — TeachAndLearn{% endblock %}
{% block content %}
<div class="min-h-full flex items-center justify-center py-12 px-4">
  <div class="w-full max-w-md text-center">
    <h1 class="text-2xl font-bold text-slate-900 mb-2">{% trans "Link expired or invalid" %}</h1>
    <p class="text-slate-500 mb-6">{% trans "This verification link has already been used or has expired." %}</p>
    <a href="/accounts/register/" class="text-violet-600 hover:underline text-sm">{% trans "Register again" %}</a>
  </div>
</div>
{% endblock %}
