{% extends "base.html" %}
{% block title %}Reset password — TeachAndLearn{% endblock %}
{% block content %}
<div class="min-h-full flex items-center justify-center py-12 px-4">
  <div class="w-full max-w-md">

    <div class="text-center mb-8">
      <h1 class="text-2xl font-bold text-slate-900">Reset your password</h1>
      <p class="mt-2 text-sm text-slate-500">Enter your email and we'll send you a reset link.</p>
    </div>

    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-8">
      <form method="post" novalidate>
        {% csrf_token %}
        <div class="mb-6">
          {% include "components/field.html" with field=form.email %}
        </div>
        <button type="submit"
          class="w-full bg-indigo-600 text-white py-2.5 rounded-lg font-medium hover:bg-indigo-700 transition-colors">
          Send reset link
        </button>
      </form>
      <p class="mt-4 text-center text-sm">
        <a href="/accounts/login/" class="text-indigo-600 hover:underline">Back to sign in</a>
      </p>
    </div>

  </div>
</div>
{% endblock %}
